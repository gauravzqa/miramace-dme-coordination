[project]
name = "miramace"
version = "0.1.0"
description = "Mira Mace DME coordination prototype (event-sourced core + AI callers + patient companion)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.60",
    "rich>=13",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
voice = [
    "livekit-agents[openai]==1.8.10",
    "livekit-plugins-openai==1.8.10",
]

[project.scripts]
mira = "miramace.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miramace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
